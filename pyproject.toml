[project]
name = "manga-studio"
version = "0.1.0"
description = "Local manga/webtoon panel studio: Qwen-Image-2.1 on Apple Silicon (mflux), driven by Claude Code, viewed in a dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mflux==0.24.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "pillow>=10",
    "httpx>=0.27",
    "ruamel-yaml>=0.18",
    "mcp>=1.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
