[package]
name = "manga-studio"
version = "0.2.0"
description = "Local manga/webtoon studio: Qwen-Image on Apple Silicon, driven by you or your AI agent"
edition = "2021"

[lib]
name = "manga_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
