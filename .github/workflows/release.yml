# Signed + notarized macOS build, attached to the GitHub release for the pushed tag.
# Runs scripts/release-mac.sh --ci --publish on an Apple Silicon runner. Secrets: docs/RELEASING.md.
# Skips (green, with a notice) when the signing secrets aren't set, or when the release already has
# the DMG (a local scripts/release-mac.sh --publish got there first).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preflight
        id: pre
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo "::notice::MACOS_CERTIFICATE isn't set; skipping the signed build (see docs/RELEASING.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -qx 'Manga-Studio-macOS-arm64.dmg'; then
            echo "::notice::Release $TAG already has Manga-Studio-macOS-arm64.dmg; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pre.outputs.run == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.pre.outputs.run == 'true'
        with:
          version: 11.24.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pre.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.pre.outputs.run == 'true'
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.pre.outputs.run == 'true'
        with:
          workspaces: app/src-tauri

      # The app runs (and may bundle) the Python backend with uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.pre.outputs.run == 'true'

      - name: Import the Developer ID certificate
        if: steps.pre.outputs.run == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          /bin/rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }

      - name: Write the App Store Connect API key
        if: steps.pre.outputs.run == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            umask 077
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize, publish
        if: steps.pre.outputs.run == 'true'
        env:
          GITHUB_REF_NAME: ${{ env.TAG }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release-mac.sh --ci --publish

      - name: Clean up the keychain and key
        if: always() && steps.pre.outputs.run == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          /bin/rm -f "$RUNNER_TEMP/AuthKey.p8"
