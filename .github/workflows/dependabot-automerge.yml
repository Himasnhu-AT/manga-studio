name: Dependabot auto-merge

# Approves Dependabot's patch and minor updates and turns on auto-merge, so GitHub merges each
# one only after the required CI checks pass (main's ruleset). Major updates wait for a person.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Himasnhu-AT/manga-studio'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and auto-merge patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR" --body "Patch or minor update: approved; merges when CI passes."
          gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
