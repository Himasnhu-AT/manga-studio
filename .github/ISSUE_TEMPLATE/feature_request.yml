name: Feature request
description: An idea for the studio, the pipeline, export, or how agents drive it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The story or page you're making and where the app gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
