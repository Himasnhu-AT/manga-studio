title: Cheek Squish Remake
notes: |
  Family slice-of-life short (Kai, Aoi, their daughter). Target look = the reference video:
  muted cool lavender-grey grade, hazy window light, black sweater on Kai in every panel.
  Workflow: make `sheet` and `room` first, pick the best of each, then every story panel
  uses [sheet, room] as image 1 / image 2 (never the previous panel).

defaults:
  model: qwen-image-2.1-turbo   # 8 steps. Switch to qwen-image-2.1 (40 steps) for final quality.
  quantize: 4                   # 24 GB Mac: 4. Try 6/8 only if memory allows.
  width: 864                    # 3:4, ~1 MP, multiples of 32
  height: 1152

# Files in refs/ and the label the prompt uses for each ("Image N: <label>.")
refs:
  family-ref.png:
    label: style and character reference - Kai (silver-white hair, black sweater), Aoi (mother) and their daughter, waving
  couple-room-ref.png:
    label: style reference - Kai and Aoi on the sofa in the living room
  original-p01.png:
    label: earlier panel of Kai pinching his daughter's cheeks on the sofa

# Verbatim blocks. Panels pick which ones to include with `use:`. Change a block once and
# every panel that uses it changes the same way - that's what keeps the vibe consistent.
blocks:
  style: >-
    Soft pastel anime webtoon panel. Muted, low-contrast, cool lavender-grey color grading,
    hazy soft daylight from a window with gentle bloom, thin clean lineart, soft cel-shading,
    calm cozy slice-of-life manhwa mood. Same art style and colors as the reference images.
    No text, no speech bubbles, no letters.
  kai: >-
    Kai, the father: young man with messy layered silver-white hair that partly covers his eyes,
    pale lilac-grey eyes, small black stud earring, oversized plain black long-sleeve crewneck
    sweater, black pants.
  aoi: >-
    Aoi, the mother: young woman with very long straight pastel periwinkle-blue hair to her waist,
    a thin side braid, a white five-petal flower hairclip, white long-sleeve nightgown with frilled
    cuffs, a ribbon tie at the chest and tiny pale flower print.
  daughter: >-
    Their daughter: a 4-year-old girl with long pastel periwinkle-blue hair, a thin side braid,
    the same white five-petal flower hairclip, round soft face with big eyes, white long-sleeve
    nightgown with a ribbon collar and tiny pale flower print.
  setting: >-
    The same living room as the reference: light grey sofa in the foreground, large window with
    sheer white curtains on the left, kitchen counter with a glass candy jar, small potted plants
    and wooden cabinets in the background on the right. Medium shot at sofa height, Kai always
    on the left.

avoid: >-
  t-shirt, white shirt, grey shirt, dress shirt, navy or dark blue hair, short hair, bob cut,
  pink dress, warm orange lighting, saturated colors, thick outlines, glossy shading, any text

panels:
  # ---- references (not in the strip) ---------------------------------
  - id: sheet
    title: Character sheet
    strip: false
    width: 1248
    height: 832
    ref_label: character reference sheet of Kai, Aoi and their daughter
    refs: [family-ref.png]
    use: [style, kai, aoi, daughter]
    action: >-
      Character turnaround sheet on a plain white background: Kai, Aoi and their daughter standing
      side by side, full body, front view, relaxed neutral smiles, evenly lit, nothing else in frame.

  - id: room
    title: Room plate
    strip: false
    ref_label: the living room set, empty
    refs: [couple-room-ref.png]
    use: [style, setting]
    action: >-
      The living room from image 1 with nobody in it: empty light grey sofa in the foreground,
      window and kitchen counter with the glass candy jar behind. Same camera height and lighting.

  # ---- story ----------------------------------------------------------
  - id: p01
    title: Squish
    refs: [sheet, room]
    use: [style, kai, daughter, setting]
    action: >-
      Kai sits on the left of the sofa and leans toward his daughter, who sits on the right facing him. BOTH of Kai's hands hold HIS DAUGHTER'S face and squeeze her cheeks (his hands are on her face, not on his own). Her cheeks are squished and blushing, eyes squeezed shut, little fists raised. Kai smiles playfully.
    bubbles:
      - {id: b1, text: "Daaad! My cheeks are already squishy!", at: [0.68, 0.13], w: 0.46, tail: [0.73, 0.42], style: speech}
    sfx: []
  - id: p02
    title: Jealous
    refs: [sheet, room]
    use: [style, kai, aoi, daughter, setting]
    action: >-
      Same as before: Kai on the sofa still squeezing his giggling daughter's cheeks with both hands. Behind the sofa backrest, Aoi peeks over it, both arms folded on top of the backrest, chin on her arms, POUTING: puffed cheeks, lips pushed out, jealous narrowed eyes, staring at Kai. Aoi does not touch anyone.
    bubbles:
      - {id: b1, text: "Hehehe! Stooop!", at: [0.2, 0.56], w: 0.32, tail: [0.42, 0.62], style: speech}
      - {id: b2, text: Hmph., at: [0.6, 0.08], w: 0.2, tail: [0.72, 0.15], style: thought}
    sfx: []
  - id: p03
    title: Candy
    refs: [sheet, room]
    use: [style, kai, daughter, setting]
    action: >-
      Kai sits on the sofa, glancing sideways with a knowing smile, and points with his index finger toward the glass candy jar on the kitchen counter in the background. His daughter stands beside the sofa, fists clenched at her chest in excitement, sparkling eyes, open-mouthed smile.
    bubbles:
      - {id: b1, text: "Go pick yourself some candy.", at: [0.24, 0.1], w: 0.42, tail: [0.35, 0.2], style: speech}
      - {id: b2, text: "YAY!", at: [0.74, 0.38], w: 0.22, tail: [0.75, 0.48], style: shout}
    sfx: []
  - id: p04
    title: What's up?
    refs: [sheet, room]
    use: [style, kai, aoi, daughter, setting]
    action: >-
      Kai sits on the left of the sofa and turns to Aoi, eyebrows raised, a gentle questioning smile. Aoi sits close on his right with her arms crossed, cheeks puffed in a pout, looking away from him. Far in the background the small daughter runs toward the candy jar on the kitchen counter.
    bubbles:
      - {id: b1, text: "So... what's up?", at: [0.3, 0.07], w: 0.38, tail: [0.32, 0.15], style: speech}
    sfx:
      - {text: "?", at: [0.12, 0.2], size: 1.4}
  - id: p05
    title: My turn
    refs: [sheet, room]
    use: [style, kai, aoi, setting]
    action: >-
      Kai and Aoi sit side by side on the sofa facing each other. Aoi points both index fingers at her own puffed blushing cheeks and looks up at him with a small pout. Kai looks at her, surprised, eyes wide.
    bubbles:
      - {id: b1, text: "Squeeze mine too.", at: [0.62, 0.12], w: 0.38, tail: [0.69, 0.28], style: speech}
    sfx: []
  - id: p06
    title: Flustered
    refs: [sheet, room]
    use: [style, kai, aoi, setting]
    action: >-
      Close two-shot on the sofa. Kai is embarrassed: bright red blushing face, one hand rubbing the back of his neck, looking away, a small sweat drop. Aoi sits close, chin up, cheeks puffed, determined, waiting.
    bubbles:
      - {id: b1, text: "H-huh? Right now?", at: [0.22, 0.09], w: 0.36, tail: [0.34, 0.2], style: speech}
      - {id: b2, text: "Right now.", at: [0.76, 0.15], w: 0.3, tail: [0.78, 0.29], style: speech}
    sfx: []
  - id: p07
    title: Waiting
    refs: [sheet, room]
    use: [style, kai, aoi, setting]
    action: >-
      Close-up: Aoi leans her face right up toward Kai with her eyes shut, cheeks puffed and pink, chin raised, waiting. Kai, red-faced, looks down at her, hands half raised and hesitating.
    bubbles:
      - {id: b1, text: "Come on!!", at: [0.76, 0.13], w: 0.32, tail: [0.62, 0.29], style: shout}
    sfx: []
  - id: p08
    title: Squish
    refs: [sheet, room]
    use: [style, kai, aoi, setting]
    action: >-
      Only Kai and Aoi are in this panel, both SITTING on the grey sofa in the living room, medium close-up from the waist up. Kai, blushing bright red and embarrassed, gently squeezes both of Aoi's cheeks with BOTH of his hands while looking slightly away. Aoi's eyes are closed with a huge happy blushing smile, a tiny heart floating beside her cheek. No child in this panel. Not standing, not a line-up.
    bubbles:
      - {id: b1, text: '...There.', at: [0.15, 0.07], w: 0.26, tail: [0.26, 0.14], style: speech}
      - {id: b2, text: Mhm~, at: [0.82, 0.14], w: 0.24, tail: [0.76, 0.27], style: speech}
    sfx: []
    avoid: >-
      t-shirt, white shirt, grey shirt, dress shirt, navy or dark blue hair, short hair, bob cut, pink dress, warm orange lighting, saturated colors, thick outlines, glossy shading, any text, the daughter, a child, standing in a row, character line-up, waving, white background
  - id: p09
    title: Caught
    refs: [sheet, room]
    use: [style, kai, aoi, daughter, setting]
    action: >-
      Wide landscape shot of the living room. On the left, Kai and Aoi sit on the grey sofa: Kai, blushing, still squeezing Aoi's cheeks with both hands, and both turn their heads toward the right in surprise. On the right side of the frame, their daughter has just come back from the kitchen counter, holding a wrapped candy in one hand and covering her mouth with the other, giggling, eyes curved shut. Keep empty space at the top of the frame.
    bubbles:
      - {id: b1, text: Hehehe~, at: [0.86, 0.12], w: 0.2, tail: [0.87, 0.42], style: speech}
    sfx: []
    width: 1152
    height: 864
  - id: p10
    title: Giggles
    refs: [sheet, room]
    use: [style, kai, aoi, daughter, setting]
    action: >-
      Wide landscape shot. In the right foreground, the daughter holds up her candy and laughs out loud with her eyes shut and mouth open. Behind her on the left, on the grey sofa, Kai hides his bright red embarrassed face behind one hand, and Aoi beside him smiles happily, cheeks still pink. All three faces fully visible. Keep empty space at the top of the frame.
    bubbles:
      - {id: b1, text: "Mommy's cheeks are squishy too!", at: [0.8, 0.14], w: 0.34, tail: [0.86, 0.5], style: speech}
      - {id: b2, text: "...", at: [0.18, 0.12], w: 0.12, tail: [0.28, 0.22], style: speech}
    sfx:
      - {text: giggle, at: [0.69, 0.4], size: 1.1, rotate: -8}
    width: 1152
    height: 864
format:
  mode: webtoon
  direction: rtl
  page:
    width: 1654
    height: 2339
  gutter: 0.018
  margin: 0.06
