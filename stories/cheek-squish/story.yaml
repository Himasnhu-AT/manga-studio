title: Cheek Squish
notes: |
  Family slice-of-life short (Kai, Aoi, their daughter). Target look = the reference video:
  muted cool lavender-grey grade, hazy window light, black sweater on Kai in every panel.
  Workflow: make `sheet` and `room` first, pick the best of each, then every story panel
  uses [sheet, room] as image 1 / image 2 (never the previous panel).

defaults:
  model: qwen-image-2.1-turbo   # 8 steps. Switch to qwen-image-2.1 (40 steps) for final quality.
  quantize: 4                   # 24 GB Mac: 4. Try 6/8 only if memory allows.
  width: 864                    # 3:4, ~1 MP, multiples of 32
  height: 1152

# Files in refs/ and the label the prompt uses for each ("Image N: <label>.")
refs:
  family-ref.png:
    label: style and character reference - Kai (silver-white hair, black sweater), Aoi (mother) and their daughter, waving
  couple-room-ref.png:
    label: style reference - Kai and Aoi on the sofa in the living room
  original-p01.png:
    label: earlier panel of Kai pinching his daughter's cheeks on the sofa

# Verbatim blocks. Panels pick which ones to include with `use:`. Change a block once and
# every panel that uses it changes the same way - that's what keeps the vibe consistent.
blocks:
  style: >-
    Soft pastel anime webtoon panel. Muted, low-contrast, cool lavender-grey color grading,
    hazy soft daylight from a window with gentle bloom, thin clean lineart, soft cel-shading,
    calm cozy slice-of-life manhwa mood. Same art style and colors as the reference images.
    No text, no speech bubbles, no letters.
  kai: >-
    Kai, the father: young man with messy layered silver-white hair that partly covers his eyes,
    pale lilac-grey eyes, small black stud earring, oversized plain black long-sleeve crewneck
    sweater, black pants.
  aoi: >-
    Aoi, the mother: young woman with very long straight pastel periwinkle-blue hair to her waist,
    a thin side braid, a white five-petal flower hairclip, white long-sleeve nightgown with frilled
    cuffs, a ribbon tie at the chest and tiny pale flower print.
  daughter: >-
    Their daughter: a 4-year-old girl with long pastel periwinkle-blue hair, a thin side braid,
    the same white five-petal flower hairclip, round soft face with big eyes, white long-sleeve
    nightgown with a ribbon collar and tiny pale flower print.
  setting: >-
    The same living room as the reference: light grey sofa in the foreground, large window with
    sheer white curtains on the left, kitchen counter with a glass candy jar, small potted plants
    and wooden cabinets in the background on the right. Medium shot at sofa height, Kai always
    on the left.

avoid: >-
  t-shirt, white shirt, grey shirt, dress shirt, navy or dark blue hair, short hair, bob cut,
  pink dress, warm orange lighting, saturated colors, thick outlines, glossy shading, any text

panels:
  # ---- references (not in the strip) ---------------------------------
  - id: sheet
    title: Character sheet
    strip: false
    width: 1248
    height: 832
    ref_label: character reference sheet of Kai, Aoi and their daughter
    refs: [family-ref.png]
    use: [style, kai, aoi, daughter]
    action: >-
      Character turnaround sheet on a plain white background: Kai, Aoi and their daughter standing
      side by side, full body, front view, relaxed neutral smiles, evenly lit, nothing else in frame.

  - id: room
    title: Room plate
    strip: false
    ref_label: the living room set, empty
    refs: [couple-room-ref.png]
    use: [style, setting]
    action: >-
      The living room from image 1 with nobody in it: empty light grey sofa in the foreground,
      window and kitchen counter with the glass candy jar behind. Same camera height and lighting.

  # ---- story ----------------------------------------------------------
  - id: p01
    title: Squish
    refs: [sheet, room]
    use: [style, kai, daughter, setting]
    action: >-
      Kai sits on the left of the sofa, smiling softly, gently pinching both cheeks of his daughter
      who sits on the right facing him. Her cheeks are squished and blushing, eyes squeezed shut,
      little fists raised.
    bubbles:
      - {text: "Daaad! My cheeks are already squishy!", at: [0.72, 0.1], w: 0.46, tail: [0.66, 0.42], style: shout}
    sfx:
      - {text: "#", at: [0.2, 0.08], size: 1.6, rotate: -12}

  - id: p02
    title: Mom watches
    refs: [sheet, room]
    use: [style, kai, aoi, daughter, setting]
    action: >-
      Same pose as before: Kai still squishing his daughter's cheeks; she laughs with her mouth open
      and eyes curved shut. Behind the sofa on the left, Aoi peeks over the backrest, chin resting on
      her hands, watching them with a gentle, slightly envious smile.
    bubbles:
      - {text: "Hehehe! Stooop! You're making them even squishier!", at: [0.62, 0.1], w: 0.5, tail: [0.5, 0.4]}

  - id: p03
    title: Candy
    refs: [sheet, room]
    use: [style, kai, daughter, setting]
    action: >-
      Kai sits on the sofa, one hand on his knee, pointing with his other index finger toward the glass
      candy jar on the kitchen counter behind. His daughter stands beside the sofa, fists clenched at
      her chest in excitement, sparkling eyes, open-mouthed smile, looking up at him.
    bubbles:
      - {text: "Here. Go pick yourself some candy.", at: [0.38, 0.08], w: 0.42, tail: [0.3, 0.22]}
      - {text: "YAY! BEST DAD EVER!", at: [0.8, 0.24], w: 0.34, tail: [0.84, 0.46], style: shout}

  - id: p04
    title: Aoi slides in
    refs: [sheet, room]
    use: [style, kai, aoi, daughter, setting]
    action: >-
      Kai sits on the left of the sofa looking sideways, puzzled. Aoi now sits close on his right,
      leaning toward him with her eyes half closed and lips puckered expectantly. Far in the background
      at the kitchen counter, the small daughter stands on tiptoe reaching into the candy jar.
    bubbles:
      - {text: "Aoi... what are you doing?", at: [0.32, 0.08], w: 0.38, tail: [0.3, 0.2]}
    sfx:
      - {text: "?", at: [0.2, 0.24], size: 1.4}

  - id: p05
    title: Waiting
    refs: [sheet, room]
    use: [style, kai, aoi, setting]
    action: >-
      Kai and Aoi sit side by side on the sofa facing each other. Aoi points both index fingers at her
      own puffed cheeks, looking up at him with a small pout. Kai looks at her, surprised.
    bubbles:
      - {text: "Waiting for my turn.", at: [0.62, 0.08], w: 0.34, tail: [0.66, 0.2]}
